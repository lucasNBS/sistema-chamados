spring.application.name=sistema-chamados

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chamados}
spring.datasource.username=${DB_USER:chamados}
spring.datasource.password=${DB_PASSWORD:dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

server.port=8080
